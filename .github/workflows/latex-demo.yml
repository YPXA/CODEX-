name: LaTeX demo PDF
on:
  push:
    paths:
      - 'examples/chinese-report/**'
      - '.github/workflows/latex-demo.yml'
  pull_request:
    paths:
      - 'examples/chinese-report/**'
      - '.github/workflows/latex-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Choose portable fonts
        working-directory: examples/chinese-report
        run: printf '\\portablefontstrue\n' > font-profile.tex
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: examples/chinese-report
          texlive_version: 2026
          latexmk_use_xelatex: true
          latexmk_shell_escape: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PDF-portable-fonts
          path: examples/chinese-report/build/main.pdf
          if-no-files-found: error
